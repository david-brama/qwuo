# Cloudflare quick tunnel for the player port only (projector stays localhost).
# Used by scripts/start-with-tunnel.sh. PLAYER_PORT defaults to 3001.
services:
  cloudflared:
    image: cloudflare/cloudflared:latest
    command:
      - tunnel
      - --no-autoupdate
      - --url
      - http://host.docker.internal:${PLAYER_PORT:-3001}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: "no"
